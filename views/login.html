<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackNest — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Specific centering for Auth pages */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0b0f1a;
            margin: 0;
        }
        .auth-container { width: 100%; max-width: 400px; padding: 20px; }
        .auth-box {
            background: rgba(22, 27, 38, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .auth-logo { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .auth-subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #fff; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; font-size: 15px; transition: 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
        .btn-primary {
            width: 100%; padding: 14px; background: #3b82f6; border: none; border-radius: 12px;
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        .switch-link { text-align: center; margin-top: 24px; font-size: 14px; color: #94a3b8; }
        .switch-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">HACK<span style="color: #3b82f6;">NEST</span></div>
            <p class="auth-subtitle">Enter your credentials to access the terminal</p>
            
            <div id="error-alert" class="alert alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Authenticate</button>
            </form>

            <p class="switch-link">New here? <a href="/register">Create Account</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const alert = document.getElementById('error-alert');

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            if (result.success) {
                window.location.href = '/dashboard';
            } else {
                alert.textContent = result.message;
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
