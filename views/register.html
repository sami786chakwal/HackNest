<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackNest — Join the Nest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Shared styles with login (kept internal for zero-path issues) */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0b0f1a; margin: 0; font-family: 'Inter', sans-serif;}
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        .auth-box { background: rgba(22, 27, 38, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .auth-logo { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .logo-accent { color: #3b82f6; }
        .auth-subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: #fff; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 11px 16px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 15px; }
        .btn-primary { width: 100%; padding: 14px; background: #3b82f6; border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .switch-link { text-align: center; margin-top: 24px; font-size: 14px; color: #94a3b8; }
        .switch-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">HACK<span class="logo-accent">NEST</span></div>
            <p class="auth-subtitle">Initialize your operative profile</p>
            
            <div id="msg-alert" class="alert"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="johndoe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Min. 8 characters" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirmPassword" placeholder="Repeat password" required>
                </div>
                <button type="submit" class="btn-primary">Create Profile</button>
            </form>

            <p class="switch-link">Already a member? <a href="/login">Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const alert = document.getElementById('msg-alert');

            const res = await fetch('/register', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            alert.style.display = 'block';
            alert.textContent = result.message;

            if (result.success) {
                alert.className = 'alert alert-success';
                setTimeout(() => window.location.href = '/login', 2000);
            } else {
                alert.className = 'alert alert-error';
            }
        });
    </script>
</body>
</html>
