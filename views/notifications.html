<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackNest — Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .notif-list { display: flex; flex-direction: column; gap: 14px; padding: 24px; }

        .notif-item {
            display: flex;
            gap: 16px;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .notif-item.unread {
            background: rgba(59,130,246,0.04);
            border-color: rgba(59,130,246,0.18);
        }
        .notif-item:hover { border-color: rgba(255,255,255,0.12); }

        .notif-left-bar {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 12px 0 0 12px;
        }
        .bar-info    { background: #3b82f6; }
        .bar-success { background: #10b981; }
        .bar-warning { background: #f59e0b; }
        .bar-danger  { background: #ef4444; }

        .notif-icon-wrap {
            width: 42px; height: 42px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .icon-info    { background: rgba(59,130,246,0.12); color: #3b82f6; }
        .icon-success { background: rgba(16,185,129,0.12); color: #10b981; }
        .icon-warning { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .icon-danger  { background: rgba(239,68,68,0.12);  color: #ef4444; }

        .notif-body { flex: 1; min-width: 0; }
        .notif-title {
            color: #fff; font-weight: 700; font-size: 15px;
            margin-bottom: 5px; display: flex; align-items: center; gap: 8px;
        }
        .unread-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #3b82f6; flex-shrink: 0;
        }
        .notif-msg { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
        .notif-meta {
            display: flex; align-items: center; gap: 12px;
            font-size: 12px; color: #64748b;
        }
        .notif-type-badge {
            padding: 2px 9px; border-radius: 10px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .badge-info    { background: rgba(59,130,246,0.12); color: #3b82f6; }
        .badge-success { background: rgba(16,185,129,0.12); color: #10b981; }
        .badge-warning { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .badge-danger  { background: rgba(239,68,68,0.12);  color: #ef4444; }

        .notif-actions { display: flex; align-items: center; flex-shrink: 0; }
        .got-it-btn {
            padding: 8px 16px;
            background: #3b82f6; border: none; border-radius: 8px;
            color: #fff; font-size: 13px; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .got-it-btn:hover { background: #2563eb; }
        .read-stamp {
            display: inline-flex; align-items: center; gap: 5px;
            color: #10b981; font-size: 13px; font-weight: 600;
        }

        .notif-empty {
            text-align: center; padding: 80px 20px; color: #64748b;
        }
        .notif-empty i { width: 48px; height: 48px; margin-bottom: 14px; }

        .topbar-actions { display: flex; gap: 10px; align-items: center; }
        .mark-all-btn {
            padding: 8px 16px;
            background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2);
            border-radius: 8px; color: #3b82f6; font-size: 13px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .mark-all-btn:hover { background: rgba(59,130,246,0.2); }

        .filter-tabs {
            display: flex; gap: 8px; padding: 16px 24px 0;
        }
        .tab-btn {
            padding: 7px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94a3b8; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: rgba(59,130,246,0.12);
            border-color: rgba(59,130,246,0.3);
            color: #3b82f6;
        }

        .unread-banner {
            margin: 0 24px 0;
            padding: 12px 16px;
            background: rgba(59,130,246,0.08);
            border: 1px solid rgba(59,130,246,0.15);
            border-radius: 10px;
            color: #60a5fa; font-size: 13px; font-weight: 600;
            display: none; align-items: center; gap: 8px;
        }
    </style>
</head>
<body class="dash-body">

<aside class="sidebar">
    <div class="sidebar-logo">HACK<span class="logo-accent">NEST</span></div>
    <nav class="sidebar-nav">
        <a href="/dashboard"   class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="/users"       class="nav-item"><i data-lucide="users"></i> Users</a>
        <a href="/challenges"  class="nav-item"><i data-lucide="shield"></i> Challenges</a>
        <a href="/scoreboard"  class="nav-item"><i data-lucide="trophy"></i> Scoreboard</a>
        <div id="admin-panel-link" style="display:none">
            <a href="/admin/users" class="nav-item admin-nav"><i data-lucide="shield-check"></i> Admin Panel</a>
        </div>
        <a href="/profile"       class="nav-item"><i data-lucide="user"></i> Profile</a>
        <a href="/notifications" class="nav-item active">
            <i data-lucide="bell"></i> Notifications
            <span id="sidebar-badge" style="
                display:none; margin-left:auto;
                background:#ef4444; color:#fff;
                font-size:10px; font-weight:800;
                padding:1px 6px; border-radius:10px;
            "></span>
        </a>
        <a href="/settings" class="nav-item"><i data-lucide="settings"></i> Settings</a>
    </nav>
    <a href="/logout" class="sidebar-logout"><i data-lucide="log-out"></i> Logout</a>
</aside>

<main class="dash-main">
    <header class="topbar">
        <div class="topbar-title">Notifications</div>
        <div class="topbar-actions">
            <button class="mark-all-btn" onclick="markAllRead()">
                <i data-lucide="check-check" style="width:14px;height:14px"></i> Mark all read
            </button>
            <div class="topbar-user">
                <span class="user-dot"></span>
                <span id="topbar-username">—</span>
            </div>
        </div>
    </header>

    <h1 class="welcome-line">YOUR <span class="logo-accent">NOTIFICATIONS</span></h1>

    <div class="panel" style="margin-top: 0">
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all"    onclick="setFilter('all',    this)">All</button>
            <button class="tab-btn"        data-filter="unread" onclick="setFilter('unread', this)">Unread</button>
            <button class="tab-btn"        data-filter="read"   onclick="setFilter('read',   this)">Read</button>
        </div>

        <div class="unread-banner" id="unread-banner">
            <i data-lucide="bell-ring" style="width:15px;height:15px"></i>
            <span id="unread-banner-text"></span>
        </div>

        <div class="notif-list" id="notif-list">
            <div class="notif-empty">
                <i data-lucide="loader" style="animation:spin 1s linear infinite"></i>
                <p>Loading...</p>
            </div>
        </div>
    </div>
</main>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<script>
lucide.createIcons();

let allNotifs  = [];
let curFilter  = 'all';

const typeIcons = {
    info:    'bell',
    success: 'check-circle',
    warning: 'alert-triangle',
    danger:  'alert-octagon'
};

async function loadNotifications() {
    try {
        const [nRes, uRes] = await Promise.all([
            fetch('/api/notifications').then(r => r.json()),
            fetch('/api/user-stats').then(r => r.json())
        ]);

        if (uRes.success) {
            const u = uRes.user;
            document.getElementById('topbar-username').textContent = u.Username;
            if (u.Role?.toLowerCase() === 'admin')
                document.getElementById('admin-panel-link').style.display = 'block';
        }

        if (!nRes.success) {
            console.error('Failed to load notifications:', nRes.message);
            document.getElementById('notif-list').innerHTML = `
                <div class="notif-empty">
                    <i data-lucide="alert-triangle"></i>
                    <p>Unable to load notifications right now.</p>
                </div>`;
            lucide.createIcons();
            return;
        }

        allNotifs = Array.isArray(nRes.notifications) ? nRes.notifications : [];
        const unread = allNotifs.filter(n => !n.IsRead).length;
        const banner = document.getElementById('unread-banner');
        if (unread > 0) {
            document.getElementById('unread-banner-text').textContent =
                `You have ${unread} unread notification${unread > 1 ? 's' : ''}`;
            banner.style.display = 'flex';
            document.getElementById('sidebar-badge').textContent = unread > 9 ? '9+' : unread;
            document.getElementById('sidebar-badge').style.display = 'inline';
        } else {
            banner.style.display = 'none';
        }

        render();
    } catch (err) {
        console.error('Load notifications error:', err);
        document.getElementById('notif-list').innerHTML = `
            <div class="notif-empty">
                <i data-lucide="alert-triangle"></i>
                <p>Unable to load notifications right now.</p>
            </div>`;
        lucide.createIcons();
    }
}

function setFilter(f, btn) {
    curFilter = f;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function render() {
    let list = allNotifs;
    if (curFilter === 'unread') list = list.filter(n => !n.IsRead);
    if (curFilter === 'read')   list = list.filter(n =>  n.IsRead);

    const container = document.getElementById('notif-list');
    if (!list.length) {
        container.innerHTML = `
            <div class="notif-empty">
                <i data-lucide="bell-off"></i>
                <p>${curFilter === 'unread' ? 'No unread notifications.' : curFilter === 'read' ? 'No read notifications yet.' : 'No notifications yet.'}</p>
            </div>`;
        lucide.createIcons();
        return;
    }

    container.innerHTML = list.map(n => {
        const t       = n.Type || 'info';
        const icon    = typeIcons[t] || 'bell';
        const dateStr = new Date(n.CreatedAt).toLocaleString();
        const isUnread = !n.IsRead;

        return `
        <div class="notif-item ${isUnread ? 'unread' : ''}" id="notif-${n.NotificationID}">
            <div class="notif-left-bar bar-${t}"></div>
            <div class="notif-icon-wrap icon-${t}">
                <i data-lucide="${icon}" style="width:20px;height:20px"></i>
            </div>
            <div class="notif-body">
                <div class="notif-title">
                    ${isUnread ? '<span class="unread-dot"></span>' : ''}
                    ${escHtml(n.Title)}
                </div>
                <div class="notif-msg">${escHtml(n.Message)}</div>
                <div class="notif-meta">
                    <span class="notif-type-badge badge-${t}">${t}</span>
                    <span><i data-lucide="clock" style="width:11px;height:11px;display:inline;margin-right:3px"></i>${dateStr}</span>
                    <span>by ${escHtml(n.SentBy)}</span>
                </div>
            </div>
            <div class="notif-actions">
                ${isUnread
                    ? `<button class="got-it-btn" onclick="markRead(${n.NotificationID})">
                           <i data-lucide="check" style="width:14px;height:14px"></i> Got it!
                       </button>`
                    : `<span class="read-stamp">
                           <i data-lucide="check-circle" style="width:15px;height:15px"></i> Read
                       </span>`
                }
            </div>
        </div>`;
    }).join('');

    lucide.createIcons();
}

async function markRead(id) {
    try {
        const response = await fetch(`/api/notifications/${id}/read`, { method: 'POST' });
        const res = await response.json();
        if (res.success) {
            allNotifs = allNotifs.map(n =>
                n.NotificationID === id ? { ...n, IsRead: true } : n
            );
            render();
            updateBadge();
        }
    } catch (err) {
        console.error('Mark read error:', err);
    }
}

async function markAllRead() {
    try {
        const response = await fetch('/api/notifications/read-all', { method: 'POST' });
        const res = await response.json();
        if (res.success) {
            allNotifs = allNotifs.map(n => ({ ...n, IsRead: true }));
            render();
            updateBadge();
        }
    } catch (err) {
        console.error('Mark all read error:', err);
    }
}

function updateBadge() {
    const unread = allNotifs.filter(n => !n.IsRead).length;
    const badge  = document.getElementById('sidebar-badge');
    if (unread > 0) {
        badge.textContent    = unread > 9 ? '9+' : unread;
        badge.style.display  = 'inline';
    } else {
        badge.style.display  = 'none';
        document.getElementById('unread-banner').style.display = 'none';
    }
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadNotifications();
</script>
</body>
</html>
